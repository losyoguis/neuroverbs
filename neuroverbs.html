<!DOCTYPE html><html lang='es'><head><meta charset='UTF-8'><title>Neuroverbs</title><script src='js/sheets-config.js'></script></head><body><h1>Neuroverbs</h1><div id='status'>Conectando…</div><div id='rank'></div><script>fetch(NEUROVERBS_SHEETS.WEB_APP_URL+'?action=ping').then(r=>r.json()).then(d=>status.innerText=d.ok?'Conectado':'Error');fetch(NEUROVERBS_SHEETS.WEB_APP_URL+'?action=leaderboard&limit=5').then(r=>r.json()).then(d=>{rank.innerHTML='';d.rows.forEach(u=>{rank.innerHTML+=`#${u.rank} ${u.name} (${u.xp})<br>`})})</script></body></html>
