<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Neuroverbs App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="js/sheets-config.js"></script>
  <link rel="stylesheet" href="css/main.css" />
</head>

<body>
  <header>
    <h1>🧠 Neuroverbs</h1>
    <p id="userStatus">Conectando con Google Sheets…</p>
  </header>

  <main>
    <section>
      <h2>🏆 Top Ranking</h2>
      <div id="rankingPreview">Cargando ranking…</div>
    </section>
  </main>

  <script>
    const BACKEND = NEUROVERBS_SHEETS.WEB_APP_URL;

    fetch(BACKEND + "?action=ping")
      .then(r => r.json())
      .then(d => {
        document.getElementById("userStatus").innerText =
          d.ok ? "✅ Conectado a Google Sheets" : "❌ Error de conexión";
      })
      .catch(() => {
        document.getElementById("userStatus").innerText =
          "❌ No se pudo conectar con Google Sheets";
      });

    fetch(BACKEND + "?action=leaderboard&limit=5")
      .then(r => r.json())
      .then(d => {
        const box = document.getElementById("rankingPreview");
        box.innerHTML = "";
        d.rows.forEach(u => {
          const div = document.createElement("div");
          div.innerText = `#${u.rank} — ${u.name} (${u.xp} XP)`;
          box.appendChild(div);
        });
      })
      .catch(() => {
        document.getElementById("rankingPreview").innerText =
          "Error cargando ranking";
      });
  </script>
</body>
</html>
