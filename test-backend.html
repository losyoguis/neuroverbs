<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test de Conexión - NEUROVERBS Backend</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 800px;
      width: 100%;
      padding: 40px;
    }
    
    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }
    
    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }
    
    .input-group {
      margin-bottom: 20px;
    }
    
    label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-weight: 600;
      font-size: 14px;
    }
    
    input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      transition: all 0.3s;
    }
    
    input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    
    .btn-group {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
      margin-bottom: 30px;
    }
    
    button {
      padding: 14px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }
    
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }
    
    button:active {
      transform: translateY(0);
    }
    
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    
    .result {
      background: #f5f5f5;
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
      max-height: 400px;
      overflow-y: auto;
    }
    
    .result h3 {
      color: #333;
      margin-bottom: 15px;
      font-size: 18px;
    }
    
    pre {
      background: #2d2d2d;
      color: #f8f8f2;
      padding: 16px;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 13px;
      line-height: 1.6;
    }
    
    .status {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-weight: 600;
    }
    
    .status.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    
    .status.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    
    .status.info {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }
    
    .instructions {
      background: #fff3cd;
      border: 1px solid #ffc107;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
    }
    
    .instructions h4 {
      color: #856404;
      margin-bottom: 10px;
    }
    
    .instructions ol {
      margin-left: 20px;
      color: #856404;
    }
    
    .instructions li {
      margin-bottom: 5px;
    }
    
    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
      display: inline-block;
      margin-left: 10px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧪 Test de Conexión Backend</h1>
    <p class="subtitle">Verifica que tu Google Apps Script esté funcionando correctamente</p>
    
    <div class="instructions">
      <h4>📋 Instrucciones:</h4>
      <ol>
        <li>Pega la URL de tu Web App publicado abajo</li>
        <li>Haz clic en "Test Debug" para verificar la conexión básica</li>
        <li>Si funciona, prueba el leaderboard</li>
      </ol>
    </div>
    
    <div class="input-group">
      <label for="webappUrl">URL del Web App:</label>
      <input 
        type="text" 
        id="webappUrl" 
        placeholder="https://script.google.com/macros/s/AKfycby.../exec"
        value="">
    </div>
    
    <div class="btn-group">
      <button onclick="testDebug()">🔍 Test Debug</button>
      <button onclick="testLeaderboard()">📊 Test Leaderboard</button>
      <button onclick="clearResults()">🗑️ Limpiar</button>
    </div>
    
    <div id="results"></div>
  </div>

  <script>
    // Cargar URL guardada si existe
    window.addEventListener('load', () => {
      const saved = localStorage.getItem('test_webapp_url');
      if (saved) {
        document.getElementById('webappUrl').value = saved;
      }
    });
    
    // Guardar URL cuando cambie
    document.getElementById('webappUrl').addEventListener('change', (e) => {
      localStorage.setItem('test_webapp_url', e.target.value);
    });
    
    function getUrl() {
      const url = document.getElementById('webappUrl').value.trim();
      if (!url) {
        showResult('error', 'Por favor ingresa la URL del Web App');
        return null;
      }
      localStorage.setItem('test_webapp_url', url);
      return url;
    }
    
    function showResult(type, title, content = null) {
      const results = document.getElementById('results');
      const timestamp = new Date().toLocaleTimeString('es-ES');
      
      let html = `
        <div class="result">
          <div class="status ${type}">
            <strong>${title}</strong>
            <small style="float:right; opacity:0.7;">${timestamp}</small>
          </div>
      `;
      
      if (content) {
        if (typeof content === 'object') {
          html += `<pre>${JSON.stringify(content, null, 2)}</pre>`;
        } else {
          html += `<p>${content}</p>`;
        }
      }
      
      html += `</div>`;
      results.innerHTML = html + results.innerHTML;
    }
    
    function showLoading(button) {
      const originalText = button.innerHTML;
      button.disabled = true;
      button.innerHTML = originalText + '<span class="spinner"></span>';
      return originalText;
    }
    
    function hideLoading(button, originalText) {
      button.disabled = false;
      button.innerHTML = originalText;
    }
    
    async function testDebug() {
      const url = getUrl();
      if (!url) return;
      
      const button = event.target;
      const originalText = showLoading(button);
      
      try {
        const testUrl = url + '?action=debug&callback=debugCallback&_=' + Date.now();
        
        showResult('info', '🔄 Probando conexión...', 'Endpoint: ' + testUrl);
        
        const response = await new Promise((resolve, reject) => {
          const timeout = setTimeout(() => reject(new Error('Timeout después de 10 segundos')), 10000);
          
          window.debugCallback = (data) => {
            clearTimeout(timeout);
            resolve(data);
          };
          
          const script = document.createElement('script');
          script.src = testUrl;
          script.onerror = () => {
            clearTimeout(timeout);
            reject(new Error('Error al cargar el script'));
          };
          document.body.appendChild(script);
        });
        
        if (response.ok) {
          showResult('success', '✅ Conexión exitosa', response);
        } else {
          showResult('error', '❌ Respuesta no OK', response);
        }
        
      } catch (error) {
        showResult('error', '❌ Error de conexión', error.toString());
      } finally {
        hideLoading(button, originalText);
      }
    }
    
    async function testLeaderboard() {
      const url = getUrl();
      if (!url) return;
      
      const button = event.target;
      const originalText = showLoading(button);
      
      try {
        const testUrl = url + '?action=leaderboard&limit=5&offset=0&callback=leaderboardCallback&_=' + Date.now();
        
        showResult('info', '🔄 Obteniendo ranking...', 'Endpoint: ' + testUrl);
        
        const response = await new Promise((resolve, reject) => {
          const timeout = setTimeout(() => reject(new Error('Timeout después de 10 segundos')), 10000);
          
          window.leaderboardCallback = (data) => {
            clearTimeout(timeout);
            resolve(data);
          };
          
          const script = document.createElement('script');
          script.src = testUrl;
          script.onerror = () => {
            clearTimeout(timeout);
            reject(new Error('Error al cargar el script'));
          };
          document.body.appendChild(script);
        });
        
        if (response.ok) {
          const count = response.leaderboard?.length || 0;
          const total = response.total || 0;
          showResult('success', `✅ Leaderboard obtenido (${count} de ${total} usuarios)`, response);
        } else {
          showResult('error', '❌ Error en leaderboard', response);
        }
        
      } catch (error) {
        showResult('error', '❌ Error al obtener leaderboard', error.toString());
      } finally {
        hideLoading(button, originalText);
      }
    }
    
    function clearResults() {
      document.getElementById('results').innerHTML = '';
      showResult('info', 'Resultados limpiados');
    }
  </script>
</body>
</html>
