<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Sincronización NEUROVERBS</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    
    h1 {
      color: #333;
      margin-bottom: 10px;
    }
    
    .subtitle {
      color: #666;
      margin-bottom: 30px;
    }
    
    .status {
      background: #f5f5f5;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-family: monospace;
      font-size: 13px;
      white-space: pre-wrap;
    }
    
    .status.success {
      background: #d4edda;
      color: #155724;
    }
    
    .status.error {
      background: #f8d7da;
      color: #721c24;
    }
    
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      width: 100%;
      margin-bottom: 10px;
    }
    
    button:hover {
      opacity: 0.9;
    }
    
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 14px;
    }
    
    label {
      display: block;
      margin-bottom: 5px;
      color: #555;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧪 Test de Sincronización</h1>
    <p class="subtitle">Verifica que la conexión con Google Sheets funcione</p>
    
    <div id="status" class="status"></div>
    
    <label for="webappUrl">URL del Web App:</label>
    <input 
      type="text" 
      id="webappUrl" 
      placeholder="https://script.google.com/macros/s/.../exec">
    
    <label for="idToken">Token (copia de localStorage):</label>
    <input 
      type="text" 
      id="idToken" 
      placeholder="Pega aquí el google_id_token">
    
    <label for="xpAmount">XP a sincronizar:</label>
    <input 
      type="number" 
      id="xpAmount" 
      placeholder="2607" 
      value="2607">
    
    <button onclick="testSync()">🚀 Probar Sincronización</button>
    <button onclick="loadFromLocalStorage()">📋 Cargar desde localStorage</button>
  </div>

  <script>
    function updateStatus(message, isError = false) {
      const status = document.getElementById('status');
      status.textContent = message;
      status.className = 'status ' + (isError ? 'error' : 'success');
    }
    
    function loadFromLocalStorage() {
      const token = localStorage.getItem('google_id_token');
      const xp = localStorage.getItem('xp');
      
      if (token) {
        document.getElementById('idToken').value = token;
        updateStatus('✅ Token cargado desde localStorage');
      } else {
        updateStatus('❌ No hay token en localStorage. Inicia sesión primero en la app principal.', true);
      }
      
      if (xp) {
        document.getElementById('xpAmount').value = xp;
      }
    }
    
    async function testSync() {
      const webappUrl = document.getElementById('webappUrl').value.trim();
      const idToken = document.getElementById('idToken').value.trim();
      const xpAmount = parseInt(document.getElementById('xpAmount').value || 0, 10);
      
      if (!webappUrl) {
        updateStatus('❌ Debes ingresar la URL del Web App', true);
        return;
      }
      
      if (!idToken) {
        updateStatus('❌ Debes ingresar el token JWT', true);
        return;
      }
      
      if (xpAmount <= 0) {
        updateStatus('❌ El XP debe ser mayor a 0', true);
        return;
      }
      
      updateStatus('⏳ Sincronizando ' + xpAmount + ' XP...');
      
      try {
        const callbackName = 'testCallback_' + Date.now();
        
        const params = new URLSearchParams({
          action: 'upsert',
          idToken: idToken,
          xpDelta: xpAmount.toString(),
          callback: callbackName,
          _: Date.now().toString()
        });
        
        const url = webappUrl + '?' + params.toString();
        
        const result = await new Promise((resolve, reject) => {
          const timeout = setTimeout(() => {
            cleanup();
            reject(new Error('Timeout: El servidor no respondió en 15 segundos'));
          }, 15000);
          
          window[callbackName] = function(data) {
            clearTimeout(timeout);
            cleanup();
            resolve(data);
          };
          
          const script = document.createElement('script');
          script.src = url;
          script.onerror = () => {
            clearTimeout(timeout);
            cleanup();
            reject(new Error('Error al cargar el script. Verifica la URL.'));
          };
          
          function cleanup() {
            try {
              delete window[callbackName];
              if (script.parentNode) {
                script.parentNode.removeChild(script);
              }
            } catch(e) {}
          }
          
          document.body.appendChild(script);
        });
        
        if (result.ok) {
          const msg = `✅ ¡Sincronización exitosa!

Usuario: ${result.user?.name || 'N/A'}
Email: ${result.user?.email || 'N/A'}
XP Total: ${result.user?.xp || 0}
Nivel: ${result.user?.level || 0}
XP Agregado: ${result.user?.xpDelta || 0}

Verifica Google Sheets para confirmar.`;
          updateStatus(msg);
        } else {
          updateStatus('❌ Error del servidor: ' + (result.error || 'Desconocido'), true);
        }
        
      } catch (error) {
        updateStatus('❌ Error: ' + error.message, true);
      }
    }
    
    // Auto-cargar URL si está en localStorage
    window.addEventListener('load', () => {
      const savedUrl = localStorage.getItem('WEB_APP_URL_V5');
      if (savedUrl) {
        document.getElementById('webappUrl').value = savedUrl;
      }
    });
  </script>
</body>
</html>
